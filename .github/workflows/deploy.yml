name: Deploy to GitHub Pages (branch)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-branch
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp public/CNAME dist/CNAME 2>/dev/null || echo akashroofingsolution.com > dist/CNAME; touch dist/.nojekyll; cp public/404.html dist/404.html 2>/dev/null || true; cp public/favicon.svg dist/favicon.svg 2>/dev/null || true
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: akashroofingsolution.com
